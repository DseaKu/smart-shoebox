[package]
name = "smart-shoebox-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/DseaKu/smart-shoebox"
description = "Desktop app for Smart Shoebox"
publish = false

[lib]
name = "smart_shoebox_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
smart-shoebox = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
dirs = "7.0.0"
ollama-rs = { version = "0.3.6", default-features = false, features = ["stream"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio-stream = "0.1"
