[package]
name = "smart-shoebox"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "shoebox"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", optional = true }
libc = "0.2.191"
lopdf = "0.42"
ollama-rs = "0.3.6"
pdf-extract = "0.12.1"
regex = "1.13.1"
rfd = { version = "0.17.2", optional = true }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }

[features]
# The window (`shoebox-gui`). Off by default, so `cargo build` builds only the
# command-line tool. Build the window with `cargo build-gui` (see .cargo/config.toml).
gui = ["dep:eframe", "dep:rfd"]

[lib]
name = "smart_shoebox"
path = "src/lib.rs"

[[bin]]
name = "shoebox"
path = "src/main.rs"

[[bin]]
name = "shoebox-gui"
path = "src/bin/shoebox-gui.rs"
required-features = ["gui"]
