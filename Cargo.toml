[package]
name = "smart-shoebox"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local-first archive for private PDFs: OCR, AI-proposed names, tags and summaries, search and questions with a local model (Ollama)"
repository = "https://github.com/DseaKu/smart-shoebox"
readme = "README.md"
keywords = ["pdf", "ocr", "ollama", "archive", "llm"]
categories = ["command-line-utilities"]
default-run = "shoebox"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
lopdf = "0.42"
ollama-rs = "0.3.6"
pdf-extract = "0.12.1"
regex = "1.13.1"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }

[lib]
name = "smart_shoebox"
path = "src/lib.rs"

[[bin]]
name = "shoebox"
path = "src/main.rs"
