# Smart Shoebox settings. `shoebox init` copies this file into a new box as shoebox.yaml.

# Ollama model used for all AI steps. Must be pulled first: ollama pull <model>
model: qwen3:8b

# Context window in tokens. Long documents are cut off silently if this is too small.
# More context needs more RAM; 16384 is enough for roughly 10 pages of text.
context_size: 16384

# Tesseract language(s) for OCR of scanned PDFs, e.g. deu or deu+eng.
ocr_language: deu

# add: let a second AI call (the reviewer) check the first proposal against the
# document text. About 3x slower; with small models (qwen3:8b) it made the tags
# worse in tests, so it is off by default. Worth trying with a bigger model.
review: false

# Embedding model for searching inside documents (`shoebox search`): turns each
# chunk of page text into a vector. Must be pulled first: ollama pull bge-m3
# Changing it means embedding every chunk again (done automatically).
embed_model: bge-m3
